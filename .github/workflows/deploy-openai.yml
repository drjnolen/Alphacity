name: Deploy OpenAI proxy

on:
  push:
    branches: [main]
    paths:
      - 'api/openai-proxy/**'
      - '.github/workflows/deploy-openai.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-openai
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check service regressions
        run: node --test tests/intel-data-worker.test.cjs
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Keep the existing Worker secret when no replacement is supplied.
          if [ -n "${OPENAI_API_KEY}" ]; then
            printf '%s' "${OPENAI_API_KEY}" | wrangler secret put OPENAI_API_KEY --config api/openai-proxy/wrangler.toml
          fi
          wrangler deploy --config api/openai-proxy/wrangler.toml
