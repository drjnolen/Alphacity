name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual re-deployment from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel any in-progress run to avoid stale deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build SUI browser client
        env:
          ALPHACITY_TELEMETRY_ENDPOINT: ${{ vars.ALPHACITY_TELEMETRY_ENDPOINT }}
          ALPHACITY_TELEMETRY_SITE_ID: ${{ vars.ALPHACITY_TELEMETRY_SITE_ID }}
        run: |
          npm ci
          npm run build

      - name: Generate public Sluice V2 runtime config
        env:
          SLUICE_NETWORK: mainnet
          SLUICE_V2_PACKAGE_ADDRESS: ${{ vars.SLUICE_V2_PACKAGE_ADDRESS }}
          SLUICE_LEGACY_PACKAGE_ADDRESS: ${{ vars.SLUICE_LEGACY_PACKAGE_ADDRESS }}
          SLUICE_ORACLE_PUBLIC_KEYS: ${{ vars.SLUICE_ORACLE_PUBLIC_KEYS }}
          SLUICE_ORACLE_THRESHOLD: ${{ vars.SLUICE_ORACLE_THRESHOLD }}
        run: node scripts/build-sluice-config.js

      - name: Run regression and security checks
        run: |
          npm test
          npm run test:climb
          npm audit --audit-level=high
          npm --prefix climb/game audit --audit-level=high

      - name: Configure existing public service endpoints
        env:
          CLIMB_LEADERBOARD_URL: ${{ vars.CLIMB_LEADERBOARD_URL }}
          INTEL_DATA_URL: ${{ vars.INTEL_DATA_URL }}
          OPENAI_PROXY_URL: ${{ vars.OPENAI_PROXY_URL || secrets.OPENAI_PROXY_URL }}
        run: node scripts/build-service-config.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the entire repository root (all static files)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
